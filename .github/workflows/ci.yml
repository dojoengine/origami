name: Origami CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  SCARB_VERSION: 2.19.4

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check format
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Format
        run: scarb fmt --check
        shell: bash

  build:
    needs: check
    runs-on: ubuntu-latest
    name: Build workspace
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Build
        run: scarb build
        shell: bash

  package:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Package publishable crates
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Package
        run: scarb package -p origami_defi -p origami_hexmap -p origami_map -p origami_random -p origami_rating -p origami_security
        shell: bash

  defi:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Test origami_defi
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Test
        run: scarb test --package origami_defi
        shell: bash

  hexmap:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Test origami_hexmap
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: 0.61.0
      - name: Test
        # Library benchmarks only; the fuzz budgets (max over 256 seeds) are checked on 64 seeds
        run: snforge test --package origami_hexmap --fuzzer-runs 64
        shell: bash

  hexmap-full:
    needs: [check, build]
    if: github.event_name == 'push'
    continue-on-error: true
    runs-on: ubuntu-latest
    name: Test origami_hexmap (losers, 256 seeds)
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: 0.61.0
      - name: Test
        # Every test, `#[ignore]`d losers included, fuzz tests on 256 seeds (non-blocking)
        run: snforge test --package origami_hexmap --include-ignored
        shell: bash

  map:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Test origami_map
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Test
        run: scarb test --package origami_map
        shell: bash

  random:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Test origami_random
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Test
        run: scarb test --package origami_random
        shell: bash

  rating:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Test origami_rating
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Test
        run: scarb test --package origami_rating
        shell: bash

  security:
    needs: [check, build]
    runs-on: ubuntu-latest
    name: Test origami_security
    steps:
      - uses: actions/checkout@v4
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: ${{ env.SCARB_VERSION }}
      - name: Test
        run: scarb test --package origami_security
        shell: bash
